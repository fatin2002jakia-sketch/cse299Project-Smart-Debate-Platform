<!DOCTYPE html>
<html>
<head>
    <title>Generated Argument</title>
    <style>
        body {
            font-family: Arial;
            background: #f7f8fc;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>

<h1>🤖 AI Generated Argument</h1>

<div class="card">
    <p><strong>Topic:</strong> {{ topic }}</p>
    <p><strong>Side:</strong> {{ side }}</p>
    <hr>
    <p><strong>Generated Argument:</strong></p>
    <p>{{ text }}</p>
</div>

<br>
<a href="/">⬅ Back to Home</a>

</body>
</html>
